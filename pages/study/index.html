<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học · Nhớ Lâu</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="study.css">
  <script type="module" src="study.js"></script>
  <!-- Công cụ dev (?seed, ?reset) — XÓA dòng này trước khi nộp -->
  <script type="module" src="../../dev/dev.js"></script>
</head>
<body>
  <!-- Cột điều hướng (L12): giống nhau ở 4 trang, chỉ khác đường dẫn và aria-current. Sửa thì sửa cả 4 file.
       Icon chép từ Lucide (lucide.dev, giấy phép ISC). Xem docs/design.md › Bố cục khung. -->
  <header class="rail">
    <a class="rail-brand" href="../../" aria-label="Nhớ Lâu"><span lang="ja">覚</span></a>
    <nav class="rail-nav" aria-label="Điều hướng chính">
      <a class="rail-link" href="../../">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="rail-label">Trang chủ</span>
      </a>
      <a class="rail-link" href="../album/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/></svg>
        <span class="rail-label">Album</span>
      </a>
      <a class="rail-link" href="../create/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        <span class="rail-label">Tạo thẻ</span>
      </a>
      <a class="rail-link" href="./" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        <span class="rail-label">Học</span>
      </a>
    </nav>
    <!-- L7: nút bật/tắt furigana, chưa có tác dụng. L7 nối nút với hàm lưu lựa chọn trong core/. -->
    <button class="rail-link rail-furigana" type="button" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      <span class="rail-label">Furigana</span>
      <span class="rail-switch" aria-hidden="true"></span>
    </button>
  </header>

  <main class="container study-main">
    <section id="deck-picker" hidden>
      <div class="study-heading">
        <h1 class="page-title">Chọn bộ để học</h1>
        <p class="muted">Chọn một bộ thẻ để bắt đầu học từ mới hoặc ôn thẻ đến hạn.</p>
      </div>
      <div id="deck-list"></div>
    </section>

    <p id="study-error" class="alert alert-error" role="alert" hidden></p>
    <button id="retry-queue" class="btn" type="button" hidden>Thử lại</button>

    <section id="session" class="study-session" hidden>
      <div class="study-bar">
        <h1 id="deck-name" class="page-title"></h1>
        <a id="exit-session" class="btn" href="./">Thoát phiên</a>
      </div>
      <section class="panel study-queue" aria-labelledby="queue-title">
        <h2 id="queue-title">Cần học trong bộ</h2>
        <div id="study-counts" class="counts study-queue-counts" aria-live="polite"></div>
      </section>
      <div class="study-workspace">
        <div class="study-card-nav" aria-label="Duyệt thẻ" role="group">
          <button id="previous-card" class="btn" type="button" aria-label="Thẻ trước" aria-keyshortcuts="ArrowLeft">←</button>
          <p id="card-position" aria-live="polite"></p>
          <button id="next-card" class="btn" type="button" aria-label="Thẻ sau" aria-keyshortcuts="ArrowRight">→</button>
        </div>
        <button id="card-stage" class="flashcard study-card" type="button"
          aria-keyshortcuts="Space" aria-live="polite">
          <span class="flashcard-inner">
            <span id="card-front" class="flashcard-face flashcard-front">
              <span class="study-card-label">Mặt trước</span>
              <span class="study-card-text"></span>
              <span class="study-card-hint">Hiện mặt sau</span>
            </span>
            <span id="card-back" class="flashcard-face flashcard-back" aria-hidden="true">
              <span class="study-card-label">Mặt sau</span>
              <span class="study-card-text"></span>
              <span class="study-card-hint">Về mặt trước</span>
            </span>
          </span>
        </button>
        <section class="panel study-rate-panel" aria-labelledby="rating-title">
          <div class="study-rate-heading">
            <h2 id="rating-title">Bạn nhớ thẻ này đến đâu?</h2>
            <p class="muted">Thời gian trên mỗi nút là lịch ôn tiếp theo.</p>
          </div>
          <div id="rating-buttons" class="rate-bar study-ratings" role="group" aria-labelledby="rating-title"></div>
          <button id="undo-session" class="btn btn-ghost" type="button" aria-keyshortcuts="Z" hidden>Hoàn tác lượt chấm</button>
        </section>
      </div>
      <section class="panel study-shortcuts" aria-labelledby="shortcuts-title">
        <h2 id="shortcuts-title">Phím tắt</h2>
        <dl>
          <div><dt>Lật thẻ</dt><dd><kbd>Space</kbd></dd></div>
          <div><dt>Đổi thẻ</dt><dd><kbd>←</kbd> <kbd>→</kbd></dd></div>
          <div><dt>Chấm điểm</dt><dd><kbd>1</kbd>–<kbd>4</kbd></dd></div>
          <div><dt>Hoàn tác</dt><dd><kbd>Z</kbd></dd></div>
        </dl>
      </section>
    </section>

    <section id="done-screen" class="panel study-done" hidden>
      <h1 id="done-title" class="empty-title" tabindex="-1">Xong rồi!</h1>
      <p id="session-summary" class="empty-text"></p>
      <p id="return-time" class="empty-text" hidden></p>
      <div class="study-tools">
        <a id="done-home" class="btn btn-primary" href="../../">Về Trang chủ</a>
        <button id="undo-done" class="btn" type="button" aria-keyshortcuts="Z" hidden>Hoàn tác</button>
      </div>
    </section>
  </main>
</body>
</html>
