<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album · Nhớ Lâu</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="album.css">
  <script type="module" src="album.js"></script>
  <!-- Công cụ dev (?seed, ?reset) — XÓA dòng này trước khi nộp -->
  <script type="module" src="../../dev/dev.js"></script>
</head>
<body>
  <!-- Cột điều hướng (L12): giống nhau ở 4 trang, chỉ khác đường dẫn và aria-current. Sửa thì sửa cả 4 file.
       Icon chép từ Lucide (lucide.dev, giấy phép ISC). Xem docs/design.md › Bố cục khung. -->
  <header class="rail">
    <a class="rail-brand" href="../../" aria-label="Nhớ Lâu"><span lang="ja">覚</span></a>
    <nav class="rail-nav" aria-label="Điều hướng chính">
      <a class="rail-link" href="../../">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="rail-label">Trang chủ</span>
      </a>
      <a class="rail-link" href="./" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"/></svg>
        <span class="rail-label">Album</span>
      </a>
      <a class="rail-link" href="../create/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        <span class="rail-label">Tạo thẻ</span>
      </a>
      <a class="rail-link" href="../study/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
        <span class="rail-label">Học</span>
      </a>
    </nav>
    <!-- L7: nút bật/tắt furigana, chưa có tác dụng. L7 nối nút với hàm lưu lựa chọn trong core/. -->
    <button class="rail-link rail-furigana" type="button" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      <span class="rail-label">Furigana</span>
      <span class="rail-switch" aria-hidden="true"></span>
    </button>
  </header>

  <!-- ALBUM — phụ trách: Thành viên 2 · việc cần làm: docs/tasks.md mục A1–A8 -->
  <main class="container">

    <!-- Chế độ 1 — pages/album/: lưới các bộ thẻ -->
    <section id="grid-view" hidden>
      <div class="page-head">
        <h1 class="page-title">Album thẻ</h1>
        <a id="new-deck-link" class="btn btn-primary" href="../create/">+ Tạo bộ mới</a>
      </div>
      <div id="deck-grid"></div>
    </section>

    <!-- Chế độ 2 — pages/album/?deck=<id>: chi tiết một bộ -->
    <section id="detail-view" hidden>
      <a class="back-link" href="./">← Tất cả bộ thẻ</a>
      <div id="deck-header"></div>
      <div id="card-toolbar" class="section album-toolbar" hidden>
        <label class="album-search">
          <span class="visually-hidden">Tìm thẻ</span>
          <input id="card-search" class="input" type="search" placeholder="Tìm theo nội dung thẻ">
        </label>
        <div id="state-filter" class="chips" role="group" aria-label="Lọc theo trạng thái">
          <button class="chip" type="button" aria-pressed="true" data-filter="all">Tất cả</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="new">Mới</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="learning">Đang học</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="review">Ôn tập</button>
        </div>
        <label class="album-sort">
          <span class="visually-hidden">Sắp xếp</span>
          <select id="card-sort" class="input">
            <option value="created">Mới tạo trước</option>
            <option value="due">Sắp đến hạn trước</option>
          </select>
        </label>
      </div>
      <p id="card-count" class="muted album-count" aria-live="polite" hidden></p>
      <div id="card-list" class="section"></div>
    </section>
  </main>

  <!-- A4 · A5 · A7: hộp xác nhận dùng chung, tiêu đề và nội dung do JS điền -->
  <dialog class="dialog" id="confirm-dialog">
    <form method="dialog">
      <h2 class="dialog-title" id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel">Hủy</button>
        <button class="btn btn-danger" value="ok" id="confirm-ok">Xóa</button>
      </div>
    </form>
  </dialog>

  <!-- A4: sửa thẻ -->
  <dialog class="dialog" id="card-dialog" aria-labelledby="card-dialog-title">
    <form>
      <h2 class="dialog-title" id="card-dialog-title">Sửa thẻ</h2>
      <p class="alert alert-error" role="alert" hidden></p>
      <label class="field">
        <span class="field-label">Mặt trước</span>
        <textarea class="input" name="front"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Mặt sau</span>
        <textarea class="input" name="back"></textarea>
        <span class="field-hint">Tiến độ học của thẻ giữ nguyên. Ctrl+Enter để lưu.</span>
      </label>
      <div class="dialog-actions">
        <button class="btn" type="button" value="cancel">Hủy</button>
        <button class="btn btn-primary" type="submit">Lưu</button>
      </div>
    </form>
  </dialog>

  <!-- A5: sửa bộ thẻ (màu bìa thêm sau L6) -->
  <dialog class="dialog" id="deck-dialog" aria-labelledby="deck-dialog-title">
    <form>
      <h2 class="dialog-title" id="deck-dialog-title">Sửa bộ thẻ</h2>
      <p class="alert alert-error" role="alert" hidden></p>
      <label class="field">
        <span class="field-label">Tên bộ thẻ</span>
        <input class="input" name="name" maxlength="80">
      </label>
      <label class="field">
        <span class="field-label">Mô tả</span>
        <textarea class="input" name="description" maxlength="300"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Thẻ mới mỗi ngày</span>
        <input class="input" name="newPerDay" type="number" min="0" max="999" step="1" inputmode="numeric">
        <span class="field-hint">Số thẻ mới tối đa được học mỗi ngày trong bộ này.</span>
      </label>
      <div class="dialog-actions">
        <button class="btn" type="button" value="cancel">Hủy</button>
        <button class="btn btn-primary" type="submit">Lưu</button>
      </div>
    </form>
  </dialog>
</body>
</html>
